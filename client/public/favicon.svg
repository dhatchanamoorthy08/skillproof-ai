<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Pure Snow White to Subtle Tint -->
    <linearGradient id="sp_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5F8FF" />
    </linearGradient>

    <!-- Cobalt Blue Gradient for Skill Foundation -->
    <linearGradient id="sp_cobalt" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#2455D6" />
      <stop offset="100%" stop-color="#1B42AC" />
    </linearGradient>

    <!-- Midnight Gradient for Contrast Growth Pillar -->
    <linearGradient id="sp_midnight" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#101A2E" />
      <stop offset="100%" stop-color="#17233D" />
    </linearGradient>

    <!-- Subtle Silver Border -->
    <linearGradient id="sp_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BFC7D5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2455D6" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Snow White Squircle Container -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#sp_bg)" stroke="url(#sp_border)" stroke-width="2" />

  <!-- Left Rising Facet (Skill Foundation in Cobalt Blue) -->
  <path d="M22 68 L22 40 C22 33 27 28 34 28 L44 28 L33 50 L46 50 L22 68 Z" fill="url(#sp_cobalt)" />

  <!-- Right Ascending Chevron (Career Growth in Midnight) -->
  <path d="M78 32 L78 60 C78 67 73 72 66 72 L56 72 L67 50 L54 50 L78 32 Z" fill="url(#sp_midnight)" />

  <!-- Verification Nexus Diamond (Snow White) -->
  <polygon points="50,22 65,39 50,56 35,39" fill="#FFFFFF" stroke="#BFC7D5" stroke-width="1.2" />

  <!-- Verification Checkmark (Cobalt Blue #2455D6) -->
  <path d="M42 39 L47.5 44.5 L58 32.5" stroke="#2455D6" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
